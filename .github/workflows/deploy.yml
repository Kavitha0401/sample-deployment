# Test, then deploy stack apps-portal and the site on every push to main.
# Deployment uses a standard secure script setup instead of AWS integrations.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the test tools
        run: python -m pip install --disable-pip-version-check "pytest>=8" "pyyaml>=6"

      - name: Python tests
        run: python -m pytest -q tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web build
        working-directory: web
        run: |
          npm i --no-audit --no-fund
          npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Sets up Python if your custom deployment script requires it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Sets up Node if your custom deployment script requires it
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # If you are using secrets or tokens for another platform (e.g., Vercel, Netlify, DockerHub, or an SSH Key),
      # they would be referenced securely here via GitHub Secrets.
      - name: Deploy the infrastructure stack
        run: python deploy_portal.py infra --ci

      - name: Deploy the site
        run: python deploy_portal.py web
